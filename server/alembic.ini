# Alembic configuration for IdeaBox / Action-Plan DB migrations
#
# Usage (cd server):
#   alembic upgrade head                      # auto create/alter tables
#   alembic revision --autogenerate -m "desc" # create a migration after changing models.py
#   alembic current / history                 # inspect status
#
# The connection URL is NOT hardcoded here: env.py reuses db.py's logic
# (PGDATABASE_URL -> PostgreSQL, else -> local SQLite). Same auto-fallback.

[alembic]
# Migration script dir (contains env.py and versions/)
script_location = migrations
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
